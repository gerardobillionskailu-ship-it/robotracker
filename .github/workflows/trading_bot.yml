name: TradeOlympo Auto-Bot

on:
  schedule:
    # Ejecución programada: Cada 15 minutos durante horas de mercado
    # UTC 13:00-21:00 cubre NY market hours (9:30am-4pm ET) en verano e invierno
    # Lunes a Viernes
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Botón para ejecución manual inmediata desde GitHub Actions UI

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Trading Bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
      run: python bot.py

    - name: Commit trade history (if updated)
      if: always()
      run: |
        git config --global user.name "TradeOlympo Bot"
        git config --global user.email "bot@tradeolympo.com"
        git add trade_history.json || true
        git commit -m "📊 Update trade history - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || true
        git push || true

    - name: Show execution summary
      if: always()
      run: |
        echo "✅ Ejecución completada"
        echo "Timestamp: $(date)"
